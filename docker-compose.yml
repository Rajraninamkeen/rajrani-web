# BILOKAT — Local development infrastructure (PostgreSQL + Redis)
# Usage: docker compose up -d
version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: bilokat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilokat
      POSTGRES_PASSWORD: bilokat_dev
      POSTGRES_DB: bilokat
    ports:
      - "5432:5432"
    volumes:
      - bilokat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilokat -d bilokat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bilokat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bilokat_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bilokat_pgdata:
  bilokat_redis:
